<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>El Quiz De La Mamá</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="board.css">
</head>
<body>
  <div id="celebration-overlay" class="hidden"></div>
  <button id="audio-btn" onclick="unlockAudio()" title="Activar sonido">🔊</button>

  <div id="app">
    <header>
      <div class="game-title">El Quiz De La Mamá</div>
      <div class="strikes">
        <div class="strike-mark" title="Strike 1"></div>
        <div class="strike-mark" title="Strike 2"></div>
        <div class="strike-mark" title="Strike 3"></div>
      </div>
    </header>

    <div id="active-team" class="active-team-banner"></div>

    <main>
      <div id="question" class="question-text">Cargando...</div>
      <div id="answers-grid" class="answers-grid"></div>
    </main>

    <footer>
      <div id="scoreboard" class="scoreboard"></div>
    </footer>
  </div>

  <script src="game.js"></script>
  <script src="board.js"></script>
</body>
</html>
